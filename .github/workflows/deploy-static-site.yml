name: Deploy Static Site via FTP

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.agent/**'
      - 'agents/**'
  workflow_dispatch: 

jobs:
  web-deploy:
    name: 🎉 Deploy Static Site
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v5
      
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Mappa la cartella root locale nella cartella di destinazione remota
          local-dir: ./
          server-dir: ${{ secrets.FTP_TARGET_DIR || '/' }} 
          
          # Escludi file non necessari al sito live
          exclude: |
            **/.git*
            **/.git*/**
            .agent/**
            .github/**
            agents/**
            docs/**
            resources/**
            README.md
            GEMINI.md
            CLAUDE.md
            *.zip
            package.json
            package-lock.json
            input.css
            tailwind.config.js
