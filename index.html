<!DOCTYPE html>
<html lang="it" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress | Ferri Ristrutturazioni</title>
    <meta name="description" content="Sito in manutenzione. Torneremo presto online con tante novità.">

    <!-- Google Fonts: Oswald & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (Compiled for Production) -->
    <link rel="stylesheet" href="assets/css/tailwind.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Iubenda Cookie Solution -->
    <script type="text/javascript"
        src="https://embeds.iubenda.com/widgets/5cf8544a-d00c-4bd7-b5af-70ac7e398983.js"></script>
    <style>
        /* Animazione Movimento Martello */
        @keyframes hammer {
            0% {
                transform: rotate(0deg);
            }

            10% {
                transform: rotate(-40deg);
            }

            15% {
                transform: rotate(30deg);
            }

            25% {
                transform: rotate(30deg);
            }

            30% {
                transform: rotate(-40deg);
            }

            100% {
                transform: rotate(0deg);
            }
        }

        .animate-hammer {
            animation: hammer 2.5s infinite ease-in-out;
            transform-origin: 30% 90%;
        }

        /* Animazione Respiro/Lavoro Operaio */
        @keyframes worker-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }

        .animate-worker-bounce {
            animation: worker-bounce 2.5s infinite ease-in-out;
        }
    </style>
</head>

<body
    class="font-sans text-secondary antialiased bg-gray-50 min-h-[100svh] overflow-x-hidden flex flex-col justify-between selection:bg-primary selection:text-white">

    <!-- Header Minimal (Logo) -->
    <header class="w-full p-6 md:p-10 z-10 flex justify-center md:justify-start">
        <div class="flex flex-col leading-none text-black w-fit items-center md:items-start">
            <span class="text-3xl md:text-4xl font-display font-bold tracking-tighter uppercase">Ferri</span>
            <span class="text-xs md:text-sm tracking-[0.2em] uppercase font-light text-primary">Ristrutturazioni</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center relative px-4 text-center mt-10 md:mt-0">

        <!-- Animated SVG Construction Worker -->
        <div class="w-48 h-48 md:w-56 md:h-56 mb-10 mx-auto" style="filter: drop-shadow(0 15px 15px rgba(0,0,0,0.25));">
            <!-- Triangle Sign -->
            <svg viewBox="0 0 100 100" class="w-full h-full block" xmlns="http://www.w3.org/2000/svg">
                <!-- Bordo Esterno Giallo e Nero -->
                <polygon points="50,5 95,85 5,85" fill="#facc15" stroke="#000" stroke-width="4"
                    stroke-linejoin="round" />
                <!-- Sfondo Triangolo Bianco -->
                <polygon points="50,13 87,79 13,79" fill="#fff" stroke="#facc15" stroke-width="2.5"
                    stroke-linejoin="round" />

                <!-- Inner Worker Group -->
                <g transform="translate(0, 5)">
                    <g class="animate-worker-bounce">
                        <!-- Corpo -->
                        <path d="M40,75 L40,50 C40,40 60,40 60,50 L60,75 Z" fill="#28292b" />
                        <!-- Testa -->
                        <circle cx="50" cy="36" r="8" fill="#FFBC7D" />
                        <!-- Caschetto Giallo -->
                        <path d="M40,35 Q50,18 60,35 Z" fill="#facc15" stroke="#28292b" stroke-width="0.5" />
                        <rect x="36" y="34" width="28" height="3" rx="1" fill="#facc15" />
                    </g>
                </g>

                <!-- Braccio col Martello (Animato Separatamente) -->
                <g transform="translate(62, 53)">
                    <g class="animate-hammer">
                        <!-- Braccio -->
                        <path d="M-5,-5 L8,8" stroke="#FFBC7D" stroke-width="4.5" stroke-linecap="round" />
                        <!-- Manico Martello -->
                        <line x1="8" y1="8" x2="25" y2="-9" stroke="#8B4513" stroke-width="3" stroke-linecap="round" />
                        <!-- Testa Martello -->
                        <rect x="20" y="-13" width="9" height="15" fill="#718096" rx="2" transform="rotate(45, 24, -5)"
                            stroke="#28292b" stroke-width="0.5" />
                    </g>
                </g>

                <!-- Pila di Mattoni da colpire -->
                <g transform="translate(0, -2)">
                    <rect x="35" y="70" width="10" height="5" fill="#e53e3e" stroke="#000" stroke-width="0.5" />
                    <rect x="46" y="70" width="10" height="5" fill="#e53e3e" stroke="#000" stroke-width="0.5" />
                    <rect x="40" y="65" width="10" height="5" fill="#e53e3e" stroke="#000" stroke-width="0.5" />
                </g>
            </svg>
        </div>

        <h1 class="font-display text-5xl md:text-7xl font-bold uppercase text-secondary mb-4 drop-shadow-md">
            Work in <span class="text-primary">Progress</span>
        </h1>
        <p class="text-gray-600 text-lg md:text-xl max-w-2xl mx-auto font-light leading-relaxed">
            Stiamo rinnovando le fondamenta del nostro spazio digitale per offrirti un'esperienza ancora più solida e
            moderna.
            <br class="hidden md:block">Il sito tornerà operativo a breve.
        </p>

    </main>

    <!-- Footer Minimal con Iubenda -->
    <footer class="bg-white text-black border-t border-gray-200 mt-12 md:mt-0 relative z-10">
        <section class="py-6">
            <div class="container flex flex-col md:flex-row justify-between items-center text-xs text-gray-600 gap-4">
                <p>&copy; 2026 Ferri Ristrutturazioni. P.IVA 12345678901. Tutti i diritti riservati.</p>
                <div class="flex flex-wrap justify-center gap-4 md:gap-6 items-center">
                    <a href="https://www.iubenda.com/privacy-policy/10210722"
                        class="iubenda-white iubenda-noiframe iubenda-embed hover:text-primary transition-colors"
                        title="Privacy Policy ">Privacy Policy</a>
                    <a href="https://www.iubenda.com/privacy-policy/10210722/cookie-policy"
                        class="iubenda-white iubenda-noiframe iubenda-embed hover:text-primary transition-colors"
                        title="Cookie Policy ">Cookie Policy</a>
                    <script
                        type="text/javascript">(function (w, d) { var loader = function () { var s = d.createElement("script"), tag = d.getElementsByTagName("script")[0]; s.src = "https://cdn.iubenda.com/iubenda.js"; tag.parentNode.insertBefore(s, tag); }; if (w.addEventListener) { w.addEventListener("load", loader, false); } else if (w.attachEvent) { w.attachEvent("onload", loader); } else { w.onload = loader; } })(window, document);</script>
                </div>
            </div>
        </section>
    </footer>

</body>

</html>
