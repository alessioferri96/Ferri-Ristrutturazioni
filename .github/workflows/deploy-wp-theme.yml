name: Deploy WordPress Theme via FTP

on:
  push:
    branches:
      - main # O il nome del branch principale che stai utilizzando (es. master)
    paths:
      - 'ferri-theme/**' # Il workflow parte solo se viene modificato qualcosa dentro questa cartella

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Mappa la cartella 'ferri-theme' locale nella cartella di destinazione remota
          local-dir: ./ferri-theme/
          server-dir: ${{ secrets.FTP_TARGET_DIR || '/' }} 
          # Nota: se FTP_TARGET_DIR non è impostato o è vuoto, caricherà nella root FTP.
          # È fortemente consigliato impostare FTP_TARGET_DIR su qualcosa come
          # public_html/wp-content/themes/ferri-theme/ oppure wp-content/themes/ferri-theme/
          
          # Evita di sovrascrivere o cancellare roba inavvertitamente se necessario,
          # o semplicemente escludi determinati file o cartelle.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
